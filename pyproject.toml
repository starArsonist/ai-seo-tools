[project]
name = "seo-tools"
version = "0.1.0"
description = "MCP server with Google Search Console, Yandex Webmaster and Wordstat data for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
]

[project.scripts]
seo-tools-mcp = "seo_tools.server:main"
seo-tools = "seo_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
